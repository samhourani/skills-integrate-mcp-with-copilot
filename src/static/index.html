<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-content">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="header-actions">
          <div id="user-badge" class="user-badge hidden">
            <span id="user-name">Guest</span>
            <span id="role-badge" class="role-badge">Student</span>
          </div>
          <button id="login-button" type="button" class="secondary-btn">Log in</button>
          <button id="logout-button" type="button" class="secondary-btn hidden">Log out</button>
        </div>
      </div>
    </header>

    <div id="login-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-header">
          <h3>School Access</h3>
          <button id="close-login-modal" type="button" class="ghost-btn" aria-label="Close login">×</button>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input id="login-email" type="email" placeholder="your-email@mergington.edu" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input id="login-password" type="password" placeholder="Enter your password" required />
          </div>
          <button type="submit">Log in</button>
        </form>
      </div>
    </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
